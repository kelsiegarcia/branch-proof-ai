 <div class="validation-container">
  <h2>BranchProofAI Validation Report</h2>

  <div>
    <p><strong>People:</strong> {{ peopleCount }}</p>
    <p><strong>Relationships:</strong> {{ relationshipsCount }}</p>
    <p><strong>Records:</strong> {{ recordsCount }}</p>
    <p><strong>Evidence Strength:</strong> {{ evidenceStrength }}</p>
  </div>

  <button (click)="generateAiAnalysis()" [disabled]="loadingAnalysis">
    {{ loadingAnalysis ? 'Generating Analysis...' : 'Generate AI Analysis' }}
  </button>

  <div *ngIf="aiAnalysis" class="analysis-card">
    <h3>AI Validation Analysis</h3>
    <p class="analysis-text">{{ aiAnalysis }}</p>
  </div>
</div>
