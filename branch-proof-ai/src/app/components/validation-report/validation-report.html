<div class="validation-container">
  <h2>BranchProofAI Validation</h2>

  <input [(ngModel)]="personOne" placeholder="Person One" />

  <input [(ngModel)]="personTwo" placeholder="Person Two" />

  <input [(ngModel)]="relationship" placeholder="Claimed Relationship" />

  <textarea
    [(ngModel)]="evidence"
    placeholder="Evidence or supporting records"
  ></textarea>

  <button (click)="submitValidation()">
    Generate Validation Report
  </button>

  <div *ngIf="loading">
    Generating report...
  </div>

  <div *ngIf="analysis">
    <h3>Validation Report</h3>
    <p>{{ analysis }}</p>
  </div>
</div>
