<h2>Relationships</h2>

<input [(ngModel)]="newRelationshipName" name="newRelationshipName" placeholder="Enter relationship name" />
<button type="button" (click)="addRelationship()">Add Relationship</button>

<p>Total relationships: {{ relationships.length }}</p>

<ul>
  <li *ngFor="let relationship of relationships">
    <span *ngIf="editingRelationshipId !== relationship._id">
      {{ relationship.name }}
      <button type="button" (click)="startEdit(relationship)">Edit</button>
      <button type="button" (click)="deleteRelationship(relationship._id)">Delete</button>
    </span>

    <span *ngIf="editingRelationshipId === relationship._id">
      <input [(ngModel)]="editRelationshipName" name="editRelationshipName" />
      <button type="button" (click)="saveEdit(relationship._id)">Save</button>
      <button type="button" (click)="cancelEdit()">Cancel</button>
    </span>
  </li>
</ul>
