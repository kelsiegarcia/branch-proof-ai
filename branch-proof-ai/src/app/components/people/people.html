<h2>People</h2>

<input [(ngModel)]="newPersonName" name="newPersonName" placeholder="Enter name" />
<button type="button" (click)="addPerson()">Add Person</button>

<p>Total people: {{ people.length }}</p>

<ul>
  <li *ngFor="let person of people">
    {{ person.name }}
    <button type="button" (click)="deletePerson(person.id)">Delete</button>
  </li>
</ul>
